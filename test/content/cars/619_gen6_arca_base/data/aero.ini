[HEADER]
VERSION=2

;conventional wisdom for Assetto Corsa dictates that you are supposed to only use the body to represent drag: but that doesn't work on these cars. A mix of body drag and rear spoiler drag is required to achieve the desired performance.
;tl:dr if you're reading this, this is where 90% of the magic happens that makes these cars what they are

[WING_0]
NAME=BODY
CHORD=1
SPAN=1.83
POSITION=0,0.3,-0.
LUT_AOA_CL=wing_body_AOA_CL.lut
LUT_GH_CL=
CL_GAIN=0.0
LUT_AOA_CD=wing_body_AOA_CD.lut
LUT_GH_CD=
CD_GAIN=0.46
ANGLE=0

[WING_1]
NAME=FRONT
CHORD=0.6
SPAN=1.85
POSITION=0,-0.3,2.05
LUT_AOA_CL=wing_front_AOA_CL.lut
LUT_GH_CL=
CL_GAIN=-2.92 ;for real downforce, value is -8.8, fake is -1
LUT_AOA_CD=wing_front_AOA_CD.lut
LUT_GH_CD=
CD_GAIN=0
ANGLE=0

[WING_2]
NAME=REAR
CHORD=0.165
SPAN=1.575
POSITION=-0.05,0.65,-2.46
LUT_AOA_CL=new_stockcarg5_g6_rear_aoa.lut
LUT_GH_CL=
CL_GAIN=1.00 ;for real downforce, we don't have a measurement: reverted so we can deal with that later, -1 by default for fake downforce
LUT_AOA_CD=wing_rear_AOA_CD.lut
LUT_GH_CD=
CD_GAIN=2.21
ANGLE=70

[WING_3]
NAME=PACKAGE
CHORD=.1
SPAN=.1
POSITION=0,-0.25,0
ANGLE=0

[WING_4]
NAME=CAMERA
CHORD=.1
SPAN=.1
POSITION=0,-0.25,.25
ANGLE=0

[WING_5]
NAME=GASCAP
CHORD=.1
SPAN=.1
POSITION=0,-0.25,-.25
ANGLE=0

[SLIPSTREAM]
EFFECT_GAIN_MULT=0.2
SPEED_FACTOR_MULT=2
