[HEADER]
VERSION=3

[TRACTION]
TYPE=RWD								

[GEARS]
COUNT=4									; forward gears number
GEAR_R=-2.35							; rear gear ratio
GEAR_1=1.778
GEAR_2=1.381
GEAR_3=1.087
GEAR_4=0.960

FINAL=4.00							; final gear ratio				

[DIFFERENTIAL]
POWER=0.001								; differential lock under power. 1.0=100% lock - 0 0% lock
COAST=0.001								; differential lock under coasting. 1.0=100% lock 0=0% lock
PRELOAD=99								; preload torque setting

[GEARBOX]
CHANGE_UP_TIME=260						; change up time in milliseconds
CHANGE_DN_TIME=275						; change down time in milliseconds
AUTO_CUTOFF_TIME=0						; Auto cutoff time for upshifts in milliseconds, 0 to disable
SUPPORTS_SHIFTER=1						; 1=Car supports shifter, 0=car supports only paddles
VALID_SHIFT_RPM_WINDOW=9000				; range window additional to the precise rev matching rpm that permits gear engage.
CONTROLS_WINDOW_GAIN=1				; multiplayer for gas,brake,clutch pedals that permits gear engage on different rev matching rpm. the lower the more difficult.
INERTIA=0.02							; gearbox inertia. default values to 0.02 if not set

[CLUTCH]
MAX_TORQUE=1200							; Clutch torque 

[AUTOCLUTCH]
UPSHIFT_PROFILE=UPSHIFT_PROFILE			; Name of the autoclutch profile for upshifts. NONE to disable autoclutch on shift up
DOWNSHIFT_PROFILE=DOWNSHIFT_PROFILE		; Same as above for downshifts
USE_ON_CHANGES=0						; Use the autoclutch on gear shifts even when autoclutch is set to off. Needed for cars with semiautomatic gearboxes. values 1,0
MIN_RPM=1500							; Minimum rpm for autoclutch engadgement
MAX_RPM=1800							; Maximum rpm for autoclutch engadgement
FORCED_ON=0

[DOWNSHIFT_PROFILE]
POINT_0=50								; Time to reach fully depress clutch
POINT_1=100 							; Time to start releasing clutch
POINT_2=175								; Time to reach fully released clutch

[UPSHIFT_PROFILE]
POINT_0=50								; Time to reach fully depress clutch
POINT_1=100 							; Time to start releasing clutch
POINT_2=175								; Time to reach fully released clutch

[AUTOBLIP]
ELECTRONIC=0							; If =1 then it is a feature of the car and cannot be disabled
POINT_0=5								; Time to reach full level
POINT_1=75								; Time to start releasing gas
POINT_2=150							; Time to reach 0 gas
LEVEL=0.75								; Gas level to be reached

[DAMAGE]
RPM_WINDOW_K=100

[AUTO_SHIFTER]
UP=8400
DOWN=4000
SLIP_THRESHOLD=0.95   					; slipratio delle ruote motrici che valuta quando cambiare marcia per non metterti in crisi
GAS_CUTOFF_TIME=0.180