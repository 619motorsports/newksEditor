[FRONT]
TYPE=DWB									; DWB , STRUT
BASEY=-0.1									; Distance of CG from the center of the wheel in meters. Front Wheel Radius+BASEY=front CoG. Actual CG height =(FWR+FBasey)+(RWR+Rbasey))/CG_LOCATION%
TRACK=1.63								; 1.63 Track width in meters (from pivot 3D placement of the 3d model of a wheel)
ROD_LENGTH=0.04							; push rod length in meters. positive raises ride height, negative lowers ride height.
HUB_MASS=50								; masse sospese anteriori
RIM_OFFSET=0.075
WBCAR_TOP_FRONT=0.44, 0.123, 0.106
WBCAR_TOP_REAR=0.44, 0.089, -0.136
WBCAR_BOTTOM_FRONT=0.62, -0.158, 0.003
WBCAR_BOTTOM_REAR=0.44, -0.118, -0.303
WBTYRE_TOP=0.239, 0.202, -0.022
WBTYRE_BOTTOM=0.204, -0.12, 0.01
WBCAR_STEER=0.648, -0.154, 0.1419
WBTYRE_STEER=0.230, -0.122, 0.1682 
TOE_OUT=0.00010						; Toe-out expressed as the length of the steering arm in meters
STATIC_CAMBER=-3.5							; Static Camber in degrees. Actual camber relative to suspension geometry and movement, check values in game
SPRING_RATE=85000						; Wheel rate stifness in Nm. Do not use spring value but calculate wheel rate
PROGRESSIVE_SPRING_RATE=0				; progressive spring rate in N/m/m
BUMP_STOP_RATE=65000						; bump stop spring rate (95000 last public)
BUMPSTOP_UP=0.045							; meters to upper bumpstop from the 0 design of the suspension
BUMPSTOP_DN=0.030							; meters to bottom bumpstop from the 0 design of the suspension
PACKER_RANGE=0.12							; Total suspension movement range, before hitting packers
DAMP_BUMP=11675						; Damper wheel rate stifness in N sec/m in compression
DAMP_FAST_BUMP=1540
DAMP_FAST_BUMPTHRESHOLD=0.120
DAMP_REBOUND=9500					; Damper wheel rate stifness in N sec/m in rebound
DAMP_FAST_REBOUND=1568
DAMP_FAST_REBOUNDTHRESHOLD=0.120
[FRONT]
TYPE=COSMIC
RIM_OFFSET=0.075                 ;same as KS
BASEY=-0.1	                ;Distance of CG from the center of the wheel in meters. Rear Wheel Radius+BASEY=Rear CoG Actual CG height =(FWR+FBasey)+(RWR+Rbasey))/CG_LOCATION%      ;same as KS
TRACK=1.63                       ;track width @ rim offset corresponding to coordinates (if coords are measured from wheel center, this number is the track at wheel center. If using rim offset at all, it's recommended to measure coords/track from hub face and input real rim offset).
HUB_MASS=50                     ;same as KS *but see notes below
TOE_OUT=0.0004                  ;same as KS
STATIC_CAMBER=-2                ;same as KS

BODY_0_NAME=T_BAR
BODY_0_MASS=0.1                 ;mass doesn't necessarily have to match real component, sometimes it's better to have lighter/heavier parts for solver stability. If the part is unsprung, it is good practice to remove it from HUB_MASS in the proportion that makes sense (e.g. a wishbone would have approximately 50% of its mass removed from HUB_MASS. This is done to ensure that the unsprung mass of the car stays accurate to the desired value)
BODY_0_INERTIA=0.0, 0.0, 0.0
BODY_0_POS=0.8, 0.2, 0.4

DJ0=WB_BOTTOM_FRONT             ;distance joints are what is used by e.g. DWB suspension in AC
DJ0_BODY_A=CHASSIS
DJ0_POS_A=0.62, -0.158, 0.003
DJ0_POS_A_1=0.62, -0.153, 0.4      ;suspension geometry adjustment available in v0.2+, see setup.ini docs below
DJ0_POS_B=0.05, -0.1, 0.0        ;if creating a 3-point wishbone (as shown here), make sure that its hub coordinates are shared or the solver will have issues
DJ1=WB_BOTTOM_REAR
DJ1_BODY_A=CHASSIS
DJ1_POS_A=0.44, -0.118, -0.303
DJ1_POS_B=0.05, -0.1, 0.0
DJ1_KP=0                        ;indicate that this joint is kingpin bottom (also works for ball joints) - used for steering axis - POS1+BODY_B is the designated coordinate/body combination
DJ2=WB_TOP_FRONT
DJ2_BODY_A=CHASSIS
DJ2_POS_A=0.44, 0.123, 0.106
DJ2_POS_B=0.1, 0.05, 0.1
DJ3=WB_TOP_REAR
DJ3_BODY_A=CHASSIS2
DJ3_POS_A=0.44, 0.089, -0.136
DJ3_POS_B=0.1, 0.05, 0.1
DJ3_KP=1                        ;indicate that this joint is kingpin top


STEER_JOINT_0=STEER_LINK        ;tie rods - only difference to distance joints is toe setup + they're steered
;STEER_JOINT_0_BODY_A=CHASSIS2
STEER_JOINT_0_POS_A=0.648, -0.154, 0.1419 ;car side (body A is chassis in this case). POS_A & POS_B work in 0.2
STEER_JOINT_0_POS_A_1=0.644, 0.0, -0.22
STEER_JOINT_0_POS_B=0.230, -0.122, 0.1682 ;tire side (body B is the hub)

;HJ0=ROCKER_HINGE                ;hinge joints can be used for many different things, in this case, as a rocker arm hinge
;HJ0_BODY_B=ROCKER               ;if BODY_A is not listed, it is assumed to be CHASSIS, and if BODY_B is not listed, it is assumed to be HUB_L. This is true for all joint types. HUB_R also available, L is default.
;HJ0_POS_A=0.6, 0, 1              ;POS0 and POS1 were standard in v0.1.79. POS_A and POS_B will alternatively work in CSP v0.2 and later and will be standard. POS0 and POS1 still usable for backwards compatibility. Position relative to wheel (same as KS)
;HJ0_POS_B=0.6, 0.1, 1
;HJ0_PARITY=-1                       ;-1 means mirrored left and right, 0 means left only, 1 means right only, default -1

[FRONT_SPRING_0]                ;simple springs can also be added
PULL_FORCE=1                   ;default 0, this works differently to how coilovers work. It pulls from both negative and positive deflection. On coilovers, the sign is simply flipped
POS_A=0.62, -0.1, -0.1 	        ;chassis (body A)
POS_B=0.62, -0.2, -0.4	        ;t-bar
;BODY_A=ROCKER
;BODY_B=T_BAR
;RATE=1                         ;N/m
;INSTALL_RATE=4000000		;optional - installation stiffness of the spring, N/m
;SPRING_LUT=(0.2=0|0.3=1230|0.4=2500)    ;Optional, m|N
;BUMPSTOP_LUT=(0=0|0.03=5000|0.06=20000) ;Optional, deflection(m)=force(N) lut for rubber bumpstops
;BUMPSTOP_GAP=0.25

TOE_OUT=0.00010						; Toe-out expressed as the length of the steering arm in meters
STATIC_CAMBER=-3.5							; Static Camber in degrees. Actual camber relative to suspension geometry and movement, check values in game
SPRING_RATE=85000						; Wheel rate stifness in Nm. Do not use spring value but calculate wheel rate
PROGRESSIVE_SPRING_RATE=0				; progressive spring rate in N/m/m
BUMP_STOP_RATE=65000						; bump stop spring rate (95000 last public)
BUMPSTOP_UP=0.045							; meters to upper bumpstop from the 0 design of the suspension
BUMPSTOP_DN=0.030							; meters to bottom bumpstop from the 0 design of the suspension
PACKER_RANGE=0.12							; Total suspension movement range, before hitting packers
DAMP_BUMP=11675						; Damper wheel rate stifness in N sec/m in compression
DAMP_FAST_BUMP=1540
DAMP_FAST_BUMPTHRESHOLD=0.120
DAMP_REBOUND=9500					; Damper wheel rate stifness in N sec/m in rebound
DAMP_FAST_REBOUND=1568
