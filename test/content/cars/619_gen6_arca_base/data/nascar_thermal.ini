; NASCAR engine thermal model configuration.
; Units: temperatures C, power kW, heat capacity kJ/C, conductance kW/C.

[MODEL]
UPDATE_HZ=20
MAX_SUBSTEPS=4
; Instrument inputs, with this base set to 240:
; CPHYS_SCRIPT_240 = grille tape fraction (0..1)
; CPHYS_SCRIPT_241 = modeled coolant temperature (C)
; CPHYS_SCRIPT_242 = modeled oil temperature (C)
; CPHYS_SCRIPT_243 = modeled cylinder-head temperature (C)
; CPHYS_SCRIPT_244 = modeled exhaust-gas temperature (C)
; CPHYS_SCRIPT_245 = modeled block temperature (C)
; CPHYS_SCRIPT_246 = cooling-flow multiplier (0..1)
; CPHYS_SCRIPT_247 = thermal torque loss (0..1)
; CPHYS_SCRIPT_248 = normalized engine life (0..1)
; CPHYS_SCRIPT_249 = cooling fan state (0 or 1)
; CPHYS_SCRIPT_250 = front-car bumper gap (m, -1 if none)
; CPHYS_SCRIPT_251 = traffic airflow multiplier (0..1)
CONTROLLER_OUTPUT_BASE=240

[OUTPUTS]
; AC's original water logic is disabled and WATER_TEMPERATURE is held at this
; known-safe value. The actual modeled coolant remains on CPHYS_SCRIPT_241.
; This prevents native heat damage without interfering with mechanical damage.
SAFE_GAME_WATER_TEMPERATURE_C=90

[DEBUG]
; Set to 1 only while diagnosing. Disabled logging does not affect the model.
ENABLED=0
PERIOD_SECONDS=2.0
; Also publish named values to CSP's in-game Lua Debug app.
LUA_DEBUG_VALUES=1
LOG_AERO_WINGS=0

[GRILLE_TAPE]
SETUP_ID=nascar_grille_tape
DEFAULT_PERCENT=40
; At 100% tape, multiply every wing's CD_GAIN by 0.975.
MAX_DRAG_REDUCTION=0.025
; A fully taped grille retains a little leakage/underbody cooling.
MIN_COOLING_FLOW=0.08
COOLING_FLOW_EXPONENT=0.336

[AERODYNAMICS]
; Uses local air density divided by ambient density at the car, rounded to
; 0.001 and capped at 1. These values affect all WING_* sections with CD_GAIN.
ENABLED=0
; Keep density queries and dynamic wing writes off the physics-rate hot path.
; Values above MODEL/UPDATE_HZ are clamped to the model rate.
UPDATE_HZ=10
; Do not rewrite wing gains for insignificant density-ratio fluctuations.
RATIO_CHANGE_EPSILON=0.005
; 0 = CSP native density response only.
; 1 = wing gain also falls one-for-one with the calculated density ratio.
; Above 1 strengthens the effect; negative values compensate for native loss.
DRAG_DENSITY_RESPONSE=1.0
DOWNFORCE_DENSITY_RESPONSE=1.0
; Safety limits for either calculated wing-gain multiplier.
MIN_GAIN_MULTIPLIER=0.25
MAX_GAIN_MULTIPLIER=1.4

[AIR_BUBBLES]
; Models the compressed-air cushion between aligned bumpers. A following car
; is pushed back while the leading car receives a smaller forward push.
ENABLED=0
SCAN_HZ=20
; VEHICLE_LENGTH_M converts center-to-center distance into bumper gap.
VEHICLE_LENGTH_M=5.0
RANGE_M=2.0
; Bubble force reaches full strength by this estimated bumper gap.
MINIMUM_GAP_M=0.30
; The pair must separate this far before a broken bubble can form again.
RESET_GAP_M=3.0
MAX_LATERAL_M=1.35
MAX_VERTICAL_M=2.0
MIN_DIRECTION_DOT=0.90
MIN_SPEED_KMH=100
; Main cushion felt by the following car and smaller push on the leader.
FRONT_CUSHION_FORCE_N=1800
REAR_PUSH_FORCE_N=700
; Adds force when the cars are approaching one another.
CLOSING_DAMPING_N_PER_MPS=180
MAX_FORCE_N=3500
FORCE_EXPONENT=1.50
; The bubble breaks at either threshold. It then stays off until RESET_GAP_M.
BREAK_GAP_M=0.12
BREAK_CLOSING_SPEED_MPS=7.0
; Smooth force changes to avoid impulses in the physics solver.
RESPONSE_SECONDS=0.06

[TRAFFIC_COOLING]
; Scan other cars at 10 Hz, independently of the 333 Hz physics callback.
ENABLED=1
SCAN_HZ=10
; Gap is estimated along this car's forward vector. VEHICLE_LENGTH_M converts
; the cars' reference-point separation into an approximate bumper gap.
VEHICLE_LENGTH_M=5.0
; A centered car at or inside FULL_EFFECT_GAP_M leaves MIN_AIRFLOW of ram air.
; The effect smoothly falls to zero at MAX_EFFECT_GAP_M.
FULL_EFFECT_GAP_M=3.0
MAX_EFFECT_GAP_M=30.0
MIN_AIRFLOW=0.20
STRENGTH_EXPONENT=1.40
; Full wake strength within the first lateral limit, fading to zero at the
; second. Direction and vertical gates reject crossing/overhead cars.
FULL_EFFECT_LATERAL_M=1.0
MAX_LATERAL_M=2.5
MAX_VERTICAL_M=3.0
MIN_DIRECTION_DOT=0.70
; Smooths traffic entering/leaving the detection volume.
RESPONSE_SECONDS=0.20

[HEAT_INPUT]
COMBUSTION_EFFICIENCY=0.34
IDLE_FUEL_POWER_KW=35
RATED_POWER_KW=500
WASTE_TO_HEAD=0.31
WASTE_TO_BLOCK=0.13
WASTE_TO_OIL=0.10

[THERMAL_MASS]
HEAD_KJ_PER_C=160
BLOCK_KJ_PER_C=700
COOLANT_KJ_PER_C=260
OIL_KJ_PER_C=110

[CONDUCTION]
HEAD_TO_COOLANT_KW_PER_C=7.0
BLOCK_TO_COOLANT_KW_PER_C=2.5
HEAD_TO_BLOCK_KW_PER_C=1.6
BLOCK_TO_OIL_KW_PER_C=0.8
OIL_TO_COOLANT_KW_PER_C=0.5
EXHAUST_TO_HEAD_KW_PER_C=0.035
HEAD_TO_AIR_KW_PER_C=0.025
BLOCK_TO_AIR_KW_PER_C=0.040

[COOLING]
THERMOSTAT_OPEN_C=76
THERMOSTAT_FULL_C=86
RADIATOR_MAX_KW_PER_C=10.0
RADIATOR_NATURAL_KW_PER_C=0.10
FAN_KW_PER_C=0.85
FAN_ON_C=100
FAN_OFF_C=94
REFERENCE_AIR_SPEED_MPS=75
RAM_AIR_EXPONENT=0.65
IDLE_PUMP_FRACTION=0.35
OIL_THERMOSTAT_OPEN_C=90
OIL_THERMOSTAT_FULL_C=105
OIL_COOLER_MAX_KW_PER_C=1.20

[EXHAUST]
IDLE_RISE_C=360
LOAD_RISE_C=520
RESPONSE_SECONDS=1.6

[DAMAGE]
COOLANT_WARNING_C=130
COOLANT_CRITICAL_C=140
COOLANT_FAILURE_C=150
OIL_WARNING_C=135
OIL_CRITICAL_C=155
OIL_FAILURE_C=175
HEAD_WARNING_C=155
HEAD_CRITICAL_C=190
HEAD_FAILURE_C=220
EGT_WARNING_C=930
EGT_CRITICAL_C=1030
EGT_FAILURE_C=1150
; Deprecated compatibility fallback for older script/config copies:
LIFE_LOSS_AT_CRITICAL_PER_S=1.5
; Permanent damage is zero at CRITICAL and reaches this rate at FAILURE.
LIFE_LOSS_AT_FAILURE_PER_S=1.5
DAMAGE_EXPONENT=2.0
COLD_OIL_LIMIT_C=45
COLD_DAMAGE_LOAD=0.75
COLD_LIFE_LOSS_PER_S=0.08
MAX_HOT_TORQUE_LOSS=0.30
MAX_COLD_TORQUE_LOSS=0.04
COLD_DERATE_END_C=75

[INITIAL_STATE]
PREWARMED=1
COOLANT_C=80
OIL_C=85
BLOCK_C=85
HEAD_C=90
EXHAUST_C=250
; A reset/new session starts with a new engine instead of inheriting a broken
; engineLifeLeft value from the previous run. Set to 0 for persistent damage.
ENGINE_LIFE=1000
REPAIR_ENGINE_ON_RESET=1
