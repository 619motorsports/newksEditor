; Localized player-adjustable ballast configuration.
; Positions are metres relative to the car: +X left, +Y up, +Z forward.
; Setup values and masses are kg.

[MODEL]
; Safety clamp applied even if setup.ini allows a larger value.
MAX_MASS_PER_CONTROL_KG=100
; CSP defaults for a stiff extra-mass linkage.
LINKAGE_DAMPING=7000000
LINKAGE_STIFFNESS=900000000
CHANGE_EPSILON_KG=0.001

[BALLAST_POOL]
; Fixed ballast budget shared by the three controls. Their setup values move
; mass out of this neutral reserve; they never add or remove total ballast.
; The supplied setup ranges total 150 kg (3 controls at 0..50 kg).
TOTAL_KG=150
; This pool is additional to car.ini TOTALMASS. To preserve an existing target
; all-in mass, reduce TOTALMASS by TOTAL_KG once when installing this system.
POS_X=0
POS_Y=0
POS_Z=0
BOX_X=0.20
BOX_Y=0.20
BOX_Z=0.20

[DEBUG]
ENABLED=0
LUA_DEBUG_VALUES=1

[WEDGE]
ENABLED=1
SETUP_ID=nascar_wedge_weight
DEFAULT_KG=0
; Default location is near the left-rear corner. Move this point to suit the car.
POS_X=0.46
POS_Y=0.254
POS_Z=-0.918
; Physical size used by CSP to calculate the added mass's inertia.
BOX_X=0.20
BOX_Y=0.20
BOX_Z=0.20

[LEFT_SIDE_BIAS]
ENABLED=1
SETUP_ID=nascar_left_side_weight
DEFAULT_KG=0
; Left side, should be between end of driver seat and rear wheel well
POS_X=0.752
POS_Y=0.385
POS_Z=-0.548
BOX_X=0.20
BOX_Y=0.20
BOX_Z=0.20

[NOSE_WEIGHT]
ENABLED=1
SETUP_ID=nascar_nose_weight
DEFAULT_KG=0
; Positive Z moves the combined CG forwards; negative Z moves it rearwards.
POS_X=0.051
POS_Y=0.235
POS_Z=1.81
BOX_X=0.20
BOX_Y=0.20
BOX_Z=0.20
